[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scixplorer"
version = "1.0.1"
description = "A Python client for SciX (Science Explorer), the successor to NASA/ADS, with composable, typed search expressions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND GPL-3.0-only"
license-files = ["LICENSE", "src/scixplorer/data/NOTICE.md", "src/scixplorer/data/LICENSE-GPL-3.0.txt"]
authors = [{ name = "Andy Casey" }]
dependencies = ["httpx>=0.27"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Documentation = "https://andycasey.github.io/scixplorer/"
Repository = "https://github.com/andycasey/scixplorer"
Issues = "https://github.com/andycasey/scixplorer/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "coverage>=7.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scixplorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: runs against the real SciX API (needs SCIX_API_TOKEN; enable with --live)",
]

[tool.coverage.run]
source_pkgs = ["scixplorer"]
branch = true
# Paths relative to the checkout, so that data files from different machines combine.
relative_files = true
# Some tests run scixplorer in a child Python process; measure those too, one data file per process.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/scixplorer"]

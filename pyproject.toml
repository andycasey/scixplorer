[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ads"
version = "1.0.0.dev0"
description = "A Python client for the NASA Astrophysics Data System (ADS) with composable, typed search expressions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND GPL-3.0-only"
license-files = ["LICENSE", "src/ads/data/NOTICE.md", "src/ads/data/LICENSE-GPL-3.0.txt"]
authors = [{ name = "Andy Casey" }]
dependencies = ["httpx>=0.27"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/ads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: runs against the real ADS API (needs ADS_API_TOKEN; enable with --live)",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ads"]
